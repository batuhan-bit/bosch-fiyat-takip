name: Günlük Bosch fiyat kontrolü

on:
  schedule:
    # Türkiye saatiyle 09:00 (UTC+3)
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      proxy_test:
        description: "Yalnızca iki ürünle proxy bağlantısını sına"
        required: false
        type: boolean
        default: false

concurrency:
  group: bosch-daily-price-check
  cancel-in-progress: false

jobs:
  check-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Projeyi indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Fiyatları kontrol et ve raporla
        env:
          PYTHONPATH: src
          TZ: Europe/Istanbul
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          MEDIAMARKT_PROXY_URL: ${{ secrets.MEDIAMARKT_PROXY_URL }}
          MAX_PRODUCTS: ${{ inputs.proxy_test && '2' || '0' }}
          PROXY_TEST: ${{ inputs.proxy_test && 'true' || 'false' }}
        run: |
          if [ "$PROXY_TEST" = "true" ]; then
            python -m bosch_tracker.main --dry-run
          else
            python -m bosch_tracker.main
          fi
