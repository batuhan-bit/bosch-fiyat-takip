name: Günlük Bosch fiyat kontrolü

on:
  schedule:
    # Türkiye saatiyle 09:00 (UTC+3)
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: bosch-daily-price-check
  cancel-in-progress: false

jobs:
  check-prices:
    # MediaMarkt bazı GitHub veri merkezi ağlarını 403 ile engelliyor.
    # Windows havuzu ayrı bir çıkış ağı sağlıyor; veri kaynağı yine resmi siteler.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Projeyi indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Fiyatları kontrol et ve raporla
        env:
          PYTHONPATH: src
          TZ: Europe/Istanbul
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python -m bosch_tracker.main
